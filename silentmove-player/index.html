<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title> SilentMovie Player</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Vazirmatn',sans-serif;
    background:#050507;
    color:#e2e2e2;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
  }

  /* ---------- loading ---------- */
  .loader-overlay{
    position:fixed;inset:0;z-index:100;
    background:#050507;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity .4s;
  }
  .loader-overlay.hidden{opacity:0;pointer-events:none}
  .spinner{
    width:48px;height:48px;border:4px solid rgba(139,92,246,.25);border-top-color:#8b5cf6;
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-overlay p{font-size:14px;color:#888}

  /* ---------- player container ---------- */
  .player-wrap{
    width:100%;max-width:900px;
    position:relative;
  }
  video{
    width:100%;max-height:80vh;
    background:#000;
    border-radius:0 0 12px 12px;
    display:block;
  }

  /* ---------- custom controls ---------- */
  .controls{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,.85));
    padding:32px 16px 12px;
    display:flex;flex-direction:column;gap:8px;
    opacity:0;transition:opacity .3s;
    border-radius:0 0 12px 12px;
  }
  .player-wrap:hover .controls,.controls.show{opacity:1}

  /* progress */
  .progress-bar{position:relative;height:6px;background:rgba(255,255,255,.15);border-radius:3px;cursor:pointer;transition:height .15s}
  .progress-bar:hover{height:10px}
  .progress-fill{height:100%;background:#8b5cf6;border-radius:3px;position:relative;pointer-events:none}
  .progress-fill::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:#fff;border-radius:50%;opacity:0;transition:opacity .15s}
  .progress-bar:hover .progress-fill::after{opacity:1}
  .progress-tooltip{
    position:absolute;top:-32px;background:#1a1a2e;color:#fff;padding:2px 8px;border-radius:4px;font-size:12px;transform:translateX(50%);pointer-events:none;opacity:0;white-space:nowrap;
  }
  .progress-bar:hover .progress-tooltip{opacity:1}

  /* buttons row */
  .btn-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .btn-group{display:flex;align-items:center;gap:6px}
  .ctrl-btn{
    background:none;border:none;color:#fff;font-size:20px;cursor:pointer;
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:background .2s;
  }
  .ctrl-btn:hover{background:rgba(255,255,255,.12)}
  .time-label{font-size:12px;color:#aaa;direction:ltr;user-select:none;min-width:95px;text-align:center}

  /* volume */
  .vol-wrap{display:flex;align-items:center;gap:4px}
  .vol-slider{
    -webkit-appearance:none;width:70px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;
    transition:width .2s;
  }
  .vol-wrap:hover .vol-slider{width:100px}
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;background:#fff;border-radius:50%;cursor:pointer;
  }

  /* ---------- error ---------- */
  .error-overlay{
    position:fixed;inset:0;z-index:90;background:#050507;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
  }
  .error-overlay.show{display:flex}
  .error-overlay .icon{font-size:48px}
  .error-overlay h2{font-size:18px;color:#f87171}
  .error-overlay p{font-size:13px;color:#888;max-width:320px;line-height:1.8}
  .error-overlay button{
    margin-top:8px;padding:10px 28px;background:#8b5cf6;color:#fff;border:none;border-radius:8px;
    font-family:inherit;font-size:14px;cursor:pointer;
  }

  /* ---------- title bar ---------- */
  .title-bar{
    width:100%;max-width:900px;
    padding:12px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .title-bar .movie-title{font-size:14px;font-weight:600;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
  .title-bar .ep-label{font-size:12px;color:#8b5cf6}

  /* double-tap areas */
  .tap-zone{
    position:absolute;top:0;bottom:0;width:35%;z-index:10;cursor:pointer;
  }
  .tap-zone.left{left:0}
  .tap-zone.right{right:0}
  .tap-feedback{
    position:absolute;top:50%;transform:translateY(-50%);
    font-size:32px;color:rgba(255,255,255,.7);pointer-events:none;
    opacity:0;transition:opacity .3s;
  }
  .tap-feedback.show{opacity:1}
  .tap-feedback.left-fb{left:20%}
  .tap-feedback.right-fb{right:20%}
</style>
</head>
<body>

<!-- Loading -->
<div class="loader-overlay" id="loader">
  <div class="spinner"></div>
  <p>در حال بارگذاری...</p>
</div>

<!-- Title -->
<div class="title-bar" id="titleBar" style="display:none">
  <span class="movie-title" id="movieTitle"></span>
  <span class="ep-label" id="epLabel"></span>
</div>

<!-- Player -->
<div class="player-wrap" id="playerWrap">
  <div class="tap-zone left" id="tapLeft"></div>
  <div class="tap-zone right" id="tapRight"></div>
  <div class="tap-feedback left-fb" id="fbLeft">⏪</div>
  <div class="tap-feedback right-fb" id="fbRight">⏩</div>

  <video id="video" playsinline></video>

  <div class="controls" id="controls">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill" style="width:0"></div>
      <span class="progress-tooltip" id="progressTooltip">0:00</span>
    </div>
    <div class="btn-row">
      <div class="btn-group">
        <button class="ctrl-btn" id="btnPlay" title="پخش/توقف">▶️</button>
        <button class="ctrl-btn" id="btnBack" title="۱۰ ثانیه عقب">⏪</button>
        <button class="ctrl-btn" id="btnFwd" title="۱۰ ثانیه جلو">⏩</button>
      </div>
      <span class="time-label" id="timeLabel">0:00 / 0:00</span>
      <div class="btn-group">
        <div class="vol-wrap">
          <button class="ctrl-btn" id="btnVol" title="صدا">🔊</button>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1">
        </div>
        <button class="ctrl-btn" id="btnPip" title="تصویر در تصویر">🖼</button>
        <button class="ctrl-btn" id="btnFull" title="تمام‌صفحه">⛶</button>
      </div>
    </div>
  </div>
</div>

<!-- Error -->
<div class="error-overlay" id="errorOverlay">
  <div class="icon">⚠️</div>
  <h2>خطا در پخش</h2>
  <p id="errorMsg">امکان پخش این فیلم وجود ندارد. لطفاً دوباره از ربات تلاش کنید.</p>
  <button onclick="location.reload()">تلاش مجدد</button>
</div>

<script>
(function(){
  /* ===== decode URL from hash ===== */
  function decodeURL(){
    const hash = window.location.hash.slice(1);
    if(!hash) return null;
    try{
      // base64url decode
      let b64 = hash.replace(/-/g,'+').replace(/_/g,'/');
      while(b64.length%4) b64+='=';
      return decodeURIComponent(escape(atob(b64)));
    }catch(e){
      return null;
    }
  }

  /* ===== parse params ===== */
  const params = new URLSearchParams(window.location.search);
  const movieTitle = params.get('t') || 'فیلم';
  const epLabel = params.get('e') || '';
  const videoURL = decodeURL();

  /* ===== Telegram WebApp ===== */
  try{
    if(window.Telegram && Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }
  }catch(e){}

  /* ===== elements ===== */
  const video = document.getElementById('video');
  const loader = document.getElementById('loader');
  const controls = document.getElementById('controls');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const progressTooltip = document.getElementById('progressTooltip');
  const timeLabel = document.getElementById('timeLabel');
  const btnPlay = document.getElementById('btnPlay');
  const btnBack = document.getElementById('btnBack');
  const btnFwd = document.getElementById('btnFwd');
  const btnVol = document.getElementById('btnVol');
  const volSlider = document.getElementById('volSlider');
  const btnPip = document.getElementById('btnPip');
  const btnFull = document.getElementById('btnFull');
  const errorOverlay = document.getElementById('errorOverlay');
  const errorMsg = document.getElementById('errorMsg');
  const titleBar = document.getElementById('titleBar');
  const movieTitleEl = document.getElementById('movieTitle');
  const epLabelEl = document.getElementById('epLabel');

  if(!videoURL){
    showError('لینک پخش نامعتبر است. لطفاً از ربات دوباره تلاش کنید.');
  }

  /* ===== setup ===== */
  movieTitleEl.textContent = movieTitle;
  epLabelEl.textContent = epLabel;
  titleBar.style.display = 'flex';
  document.title = movieTitle + (epLabel ? ' — ' + epLabel : '');

  video.src = videoURL;

  /* ===== events ===== */
  video.addEventListener('loadedmetadata', function(){
    loader.classList.add('hidden');
    updateTimeLabel();
  });

  video.addEventListener('canplay', function(){
    loader.classList.add('hidden');
  });

  video.addEventListener('waiting', function(){
    loader.classList.remove('hidden');
  });

  video.addEventListener('playing', function(){
    loader.classList.add('hidden');
  });

  video.addEventListener('error', function(){
 if(video.src){
      showError('فرمت این فیلم پشتیبانی نمی‌شود یا لینک منقضی شده. لطفاً دوباره از ربات تلاش کنید.');
    }
  });

  video.addEventListener('timeupdate', function(){
    if(!video.duration) return;
    const pct = (video.currentTime / video.duration) * 100;
    progressFill.style.width = pct + '%';
    updateTimeLabel();
  });

  /* play/pause */
  btnPlay.addEventListener('click', togglePlay);
  video.addEventListener('click', togglePlay);

  function togglePlay(){
    if(video.paused){ video.play(); }else{ video.pause(); }
  }

  video.addEventListener('play', function(){ btnPlay.textContent = '⏸'; });
  video.addEventListener('pause', function(){ btnPlay.textContent = '▶️'; });

  /* skip */
  btnBack.addEventListener('click', function(){ video.currentTime = Math.max(0, video.currentTime - 10); });
  btnFwd.addEventListener('click', function(){ video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });

  /* volume */
  volSlider.addEventListener('input', function(){
    video.volume = parseFloat(volSlider.value);
    updateVolIcon();
  });
  btnVol.addEventListener('click', function(){
    video.muted = !video.muted;
    updateVolIcon();
  });
  function updateVolIcon(){
    if(video.muted || video.volume === 0) btnVol.textContent = '🔇';
    else if(video.volume < 0.5) btnVol.textContent = '🔉';
    else btnVol.textContent = '🔊';
  }

  /* pip */
  btnPip.addEventListener('click', async function(){
    try{
      if(document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
    }catch(e){}
  });

  /* fullscreen */
  btnFull.addEventListener('click', function(){
    if(!document.fullscreenElement) video.requestFullscreen().catch(function(){});
    else document.exitFullscreen();
  });

  /* progress bar seek */
  progressBar.addEventListener('click', function(e){
    const rect = progressBar.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const pct = x / rect.width;
    if(video.duration) video.currentTime = pct * video.duration;
  });

  progressBar.addEventListener('mousemove', function(e){
    const rect = progressBar.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    if(video.duration){
      progressTooltip.textContent = formatTime(pct * video.duration);
      progressTooltip.style.left = (pct * 100) + '%';
    }
  });

  /* double-tap to seek (mobile) */
  let lastTap = 0;
  let tapTimer = null;
  function handleTap(direction){
    const now = Date.now();
    if(now - lastTap < 300){
      clearTimeout(tapTimer);
      if(direction === 'left'){
        video.currentTime = Math.max(0, video.currentTime - 10);
        showFeedback('fbLeft');
      }else{
        video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
        showFeedback('fbRight');
      }
    }else{
      tapTimer = setTimeout(function(){ togglePlay(); }, 300);
    }
    lastTap = now;
  }
  document.getElementById('tapLeft').addEventListener('click', function(){ handleTap('left'); });
  document.getElementById('tapRight').addEventListener('click', function(){ handleTap('right'); });

  function showFeedback(id){
    const el = document.getElementById(id);
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 500);
  }

  /* keyboard shortcuts */
  document.addEventListener('keydown', function(e){
    switch(e.key){
      case ' ': case 'k': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': video.currentTime = Math.max(0, video.currentTime - 10); break;
      case 'ArrowRight': video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); break;
      case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); volSlider.value = video.volume; updateVolIcon(); break;
      case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); volSlider.value = video.volume; updateVolIcon(); break;
      case 'f': btnFull.click(); break;
      case 'm': video.muted = !video.muted; updateVolIcon(); break;
    }
  });

  /* auto-hide controls */
  let hideTimer;
  function resetHideTimer(){
    controls.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){ if(!video.paused) controls.classList.remove('show'); }, 3000);
  }
  document.addEventListener('mousemove', resetHideTimer);
  document.addEventListener('touchstart', resetHideTimer);
  video.addEventListener('play', resetHideTimer);
  video.addEventListener('pause', function(){ controls.classList.add('show'); });

  /* helpers */
  function formatTime(s){
    if(!s || isNaN(s)) return '0:00';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    if(h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return m + ':' + String(sec).padStart(2,'0');
  }
  function updateTimeLabel(){
    timeLabel.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
  }
  function showError(msg){
    loader.classList.add('hidden');
    errorMsg.textContent = msg;
    errorOverlay.classList.add('show');
  }

  /* MKV warning */
  if(videoURL && (videoURL.toLowerCase().includes('.mkv') || videoURL.toLowerCase().includes('mkv'))){
    // MKV might not play in browser - add source element check
    video.addEventListener('error', function(){
      if(!errorOverlay.classList.contains('show')){
        showError('فرمت MKV ممکن است در مرورگر پخش نشود. لطفاً از دکمه دانلود استفاده کنید یا از VLC پخش کنید.');
      }
    }, {once:true});
  }

  /* try to autoplay */
  video.play().catch(function(){});

})();
</script>
</body>
</html>
